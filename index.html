<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Mizan Budget</title>
<meta name="description" content="Personal budget tracker: income, expenses, category budgets, savings goals.">
<meta name="theme-color" content="#14b8a6">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Mizan">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--p1:#2dd4bf;--p2:#0f9488;--bg:#eef3f7;--card:#fff;--text:#1f2a37;--muted:#8a96a6;--soft:#f2f4f8;--line:#e6eaf0;--tint:#e0f5f1;--green:#3cbf7f;--red:#e66060;--orange:#f0a040;--shadow:0 6px 24px rgba(30,50,70,.06)}
:root[data-dark="1"]{--bg:#0e1317;--card:#182027;--text:#e8edf2;--muted:#8b98a5;--soft:#222b33;--line:#2a343d;--tint:#17302d;--shadow:none}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:"IBM Plex Sans Arabic",-apple-system,"Segoe UI",Tahoma,sans-serif;-webkit-font-smoothing:antialiased}
body{min-height:100vh;overscroll-behavior-y:none}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
input,select{font:inherit;color:inherit}
#app{max-width:520px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 14px) 16px calc(env(safe-area-inset-bottom) + 120px)}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:6px 0 18px}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:26px}
.brand .logo{width:38px;height:38px;border-radius:12px;background:linear-gradient(135deg,var(--p1),var(--p2));display:grid;place-items:center;color:#fff;font-size:20px}
h1{font-size:32px;margin:0;font-weight:700}
.sub{color:var(--muted);font-size:14px;margin-top:2px}
.pillbtn{background:var(--card);border-radius:999px;padding:10px 16px;display:flex;align-items:center;gap:8px;font-weight:500;box-shadow:var(--shadow);white-space:nowrap}
.card{background:var(--card);border-radius:22px;padding:18px;margin-bottom:14px;box-shadow:var(--shadow)}
.monthbar{display:flex;align-items:center;justify-content:space-between;padding:14px 18px;font-weight:600;font-size:17px}
.monthbar .lbl{display:flex;align-items:center;gap:10px}
.chev{width:32px;height:32px;display:grid;place-items:center;color:var(--muted);border-radius:50%}
[dir=rtl] .flip{transform:scaleX(-1)}
.hero{background:linear-gradient(135deg,var(--p1),var(--p2));color:#fff;border-radius:24px;padding:22px;margin-bottom:14px;box-shadow:0 10px 30px color-mix(in srgb,var(--p2) 35%,transparent)}
.hero .t{opacity:.85;font-size:15px}
.hero .big{font-size:40px;font-weight:700;text-align:center;margin:10px 0 14px}
.hero .row{display:flex;justify-content:space-between;gap:12px}
.hero .row>div{flex:1}
.hero .row>div+div{border-inline-start:1px solid rgba(255,255,255,.3);padding-inline-start:14px}
.hero .v{font-size:20px;font-weight:600;margin-top:4px}
.sec{color:var(--muted);font-size:16px;margin:18px 4px 10px;display:flex;justify-content:space-between;align-items:center}
.sec button{color:var(--p2);font-weight:600}
.money{direction:ltr;unicode-bidi:isolate;display:inline-block;white-space:nowrap}
.money small{font-size:.8em;opacity:.8}
.catcard .head{display:flex;align-items:center;gap:12px}
.tile{width:46px;height:46px;border-radius:14px;background:var(--soft);display:grid;place-items:center;font-size:24px;flex:none}
.tile.t{background:var(--tint)}
.catcard .name{font-weight:600;font-size:18px;flex:1}
.status{font-size:14px;color:var(--muted)}
.status.bad{color:var(--red)}
.amtline{margin:12px 0 10px;font-size:26px;font-weight:700}
.amtline .of{font-size:17px;font-weight:500;color:var(--muted)}
.bar{height:9px;border-radius:9px;background:var(--soft);overflow:hidden}
.bar>i{display:block;height:100%;border-radius:9px;background:var(--p1)}
.foot{display:flex;justify-content:space-between;color:var(--muted);font-size:14px;margin-top:10px}
.green{color:var(--green)}.red{color:var(--red)}.muted{color:var(--muted)}
.empty{text-align:center;padding:36px 18px}
.empty .art{width:120px;height:120px;border-radius:50%;background:var(--tint);display:grid;place-items:center;font-size:60px;margin:0 auto 16px}
.empty b{display:block;font-size:19px;margin-bottom:6px}
.fab{position:fixed;bottom:calc(env(safe-area-inset-bottom) + 100px);inset-inline-end:max(20px,calc(50vw - 240px));width:62px;height:62px;border-radius:50%;background:linear-gradient(135deg,var(--p1),var(--p2));color:#fff;font-size:34px;display:grid;place-items:center;box-shadow:0 8px 24px color-mix(in srgb,var(--p2) 45%,transparent);z-index:20}
.tabs{position:fixed;bottom:calc(env(safe-area-inset-bottom) + 10px);left:50%;transform:translateX(-50%);width:min(488px,calc(100% - 24px));background:color-mix(in srgb,var(--card) 88%,transparent);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-radius:999px;padding:6px;display:flex;box-shadow:0 8px 30px rgba(0,0,0,.1);z-index:30;border:1px solid var(--line)}
.tabs button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:7px 0;border-radius:999px;font-size:12px;font-weight:500}
.tabs button.on{background:var(--soft);color:var(--p2)}
.tabs svg{width:26px;height:26px}
/* calendar */
.navm{display:flex;align-items:center;justify-content:space-between;margin:10px 0 14px}
.navm .c{text-align:center}.navm .c small{color:var(--muted);display:block}.navm .c b{font-size:24px}
.navm .chev{color:var(--p2)}
.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.grid .wd{text-align:center;color:var(--muted);font-size:13px;padding-bottom:4px}
.day{background:var(--soft);border-radius:12px;min-height:66px;padding:6px 2px;text-align:center;font-weight:600;font-size:17px;border:2px solid transparent;position:relative;display:flex;flex-direction:column;align-items:center}
.day.out{opacity:.4;background:transparent}
.day.today{border-color:var(--p2);background:var(--tint)}
.day.sel{border-color:var(--p1)}
.day .k{font-size:10px;font-weight:600;line-height:1.2}
.day .dot{position:absolute;top:5px;inset-inline-end:6px;width:6px;height:6px;border-radius:50%;background:var(--p2)}
.sum3{display:flex;justify-content:space-between;gap:8px;margin-top:6px;flex-wrap:wrap}
.sum3 div{font-size:13px;color:var(--muted)}.sum3 b{display:block;font-size:17px;color:var(--text)}
.hr{height:1px;background:var(--line);margin:16px 0}
.txrow{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line);width:100%;text-align:start}
.txrow:last-child{border-bottom:0}
.txrow .mid{flex:1;min-width:0}.txrow .mid small{color:var(--muted);display:block;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.addround{width:52px;height:52px;border-radius:50%;background:var(--tint);color:var(--p2);font-size:30px;display:grid;place-items:center;flex:none}
/* stats */
.bars2{display:flex;justify-content:center;align-items:flex-end;gap:60px;height:220px;margin:8px 0}
.bars2 .b{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;width:72px;color:var(--muted);font-size:14px;gap:6px}
.bars2 .b i{display:block;width:100%;border-radius:12px;min-height:8px}
.legend{display:flex;gap:30px;flex-wrap:wrap}
.legend div{color:var(--muted);font-size:14px}.legend b{display:block;color:var(--text);font-size:19px}
.dotc{display:inline-block;width:10px;height:10px;border-radius:50%;margin-inline-end:6px}
.tiles2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0}
.tiles2>div{background:var(--soft);border-radius:16px;padding:14px;font-size:13px;color:var(--muted)}
.tiles2 b{display:block;font-size:19px;margin-top:6px}
.ctitle{display:flex;align-items:center;gap:10px;font-size:20px;font-weight:700}
.ctitle span{color:var(--p2)}
.trend{display:flex;justify-content:space-around;align-items:flex-end;height:200px;margin-top:14px}
.trend button{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;font-size:12px;color:var(--muted);gap:6px;flex:1}
.trend .pair{display:flex;align-items:flex-end;gap:4px;height:170px}
.trend .pair i{width:14px;border-radius:6px;min-height:4px;display:block}
.trend button.on{color:var(--p2);font-weight:700}
.infobox{background:var(--soft);border-radius:16px;padding:16px;text-align:center;color:var(--muted);margin-top:12px}
/* settings */
.srow{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 0;border-bottom:1px solid var(--line);width:100%;text-align:start;min-height:56px}
.srow:last-child{border-bottom:0}
.srow .l{display:flex;align-items:center;gap:12px;font-size:17px}
.srow .r{color:var(--muted);display:flex;align-items:center;gap:8px}
.card h3{margin:0 0 4px;font-size:20px}
.seg{display:inline-flex;background:var(--soft);border-radius:999px;padding:3px}
.seg button{padding:6px 16px;border-radius:999px;color:var(--muted);font-weight:600}
.seg button.on{background:var(--card);color:var(--text);box-shadow:0 1px 4px rgba(0,0,0,.1)}
.tog{width:56px;height:32px;border-radius:999px;background:var(--line);position:relative;transition:.2s;flex:none}
.tog::after{content:"";position:absolute;top:3px;inset-inline-start:3px;width:26px;height:26px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.2);transition:.2s}
.tog.on{background:var(--p2)}.tog.on::after{inset-inline-start:27px}
/* sheets */
.ov{position:fixed;inset:0;background:rgba(10,20,30,.35);z-index:100;display:flex;align-items:flex-end;justify-content:center;opacity:0;transition:opacity .25s}
.ov.in{opacity:1}
.sh{background:var(--bg);width:100%;max-width:560px;max-height:94vh;border-radius:28px 28px 0 0;overflow:auto;transform:translateY(100%);transition:transform .28s cubic-bezier(.2,.8,.2,1);padding:0 16px calc(env(safe-area-inset-bottom) + 24px)}
.ov.in .sh{transform:none}
.grab{width:42px;height:5px;border-radius:5px;background:var(--line);margin:10px auto}
.shh{display:flex;align-items:center;justify-content:space-between;direction:ltr;gap:10px;margin-bottom:16px;position:sticky;top:0;background:var(--bg);padding:6px 0;z-index:2}
.shh h3{margin:0;font-size:20px;text-align:center;flex:1}
.shh .pillbtn{color:var(--p2);min-width:76px;justify-content:center}
.seg2{display:flex;background:var(--soft);border-radius:16px;padding:4px;margin-bottom:12px}
.seg2 button{flex:1;padding:12px;border-radius:12px;color:var(--muted);font-weight:600}
.seg2 button.on{background:var(--p1);color:#fff}
.amtin{display:flex;justify-content:center;align-items:center;gap:8px;direction:ltr;margin:18px 0}
.amtin input{border:0;background:transparent;font-size:56px;font-weight:700;width:6ch;text-align:center;outline:none;min-width:2ch}
.amtin span{font-size:24px;color:var(--muted)}
.lbl{font-weight:600;margin:6px 4px 10px}
.chips{display:flex;gap:12px;overflow-x:auto;padding:4px 2px 10px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{display:flex;flex-direction:column;align-items:center;gap:6px;min-width:72px;font-size:13px;color:var(--muted)}
.chip .tile{width:62px;height:62px;border-radius:18px;font-size:30px;border:2px solid transparent;background:var(--card)}
.chip.on{color:var(--text);font-weight:600}.chip.on .tile{border-color:var(--p1);background:var(--tint)}
.chip.add .tile{border:2px dashed var(--p1);color:var(--p2);background:transparent}
.form{background:var(--card);border-radius:20px;padding:0 16px;margin:10px 0}
.frow{display:flex;align-items:center;gap:12px;min-height:60px;border-bottom:1px solid var(--line)}
.frow:last-child{border-bottom:0}
.frow .ic{width:36px;height:36px;border-radius:10px;background:var(--tint);display:grid;place-items:center;flex:none}
.frow label{flex:1;font-size:17px}
.frow input,.frow select{border:0;background:var(--soft);border-radius:12px;padding:9px 12px;outline:none;max-width:60%;text-align:end}
.frow input[type=text],.frow input.wide{background:transparent;text-align:end;flex:1;max-width:none}
.bigbtn{width:100%;padding:16px;border-radius:18px;background:linear-gradient(135deg,var(--p1),var(--p2));color:#fff;font-weight:700;font-size:17px;margin-top:14px}
.bigbtn.ghost{background:var(--card);color:var(--red)}
.bigbtn:disabled{opacity:.4}
.err{color:var(--red);text-align:center;font-size:14px;min-height:20px;margin-top:8px}
.bcard{background:var(--card);border-radius:22px;padding:16px;margin-bottom:12px}
.bcard .head{display:flex;align-items:center;gap:12px;font-size:18px;font-weight:500;margin-bottom:12px}
.ain{display:flex;align-items:center;gap:8px;background:var(--soft);border-radius:14px;padding:12px 14px;direction:ltr}
.ain input{border:0;background:transparent;outline:none;font-size:22px;font-weight:600;flex:1;min-width:0}
.ain span{color:var(--muted)}
.list .opt{display:flex;align-items:center;gap:12px;padding:14px 16px;border-bottom:1px solid var(--line);width:100%;text-align:start;font-size:17px}
.list .opt:last-child{border-bottom:0}
.list .opt .ck{margin-inline-start:auto;color:var(--p2);font-weight:700}
.emo{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:4px;margin-top:10px}
.emo button{font-size:24px;padding:6px 0;border-radius:10px}
.frow input,.frow select,.frow label{min-width:0}
.emo button.on{background:var(--tint);outline:2px solid var(--p1)}
.toast{position:fixed;top:calc(env(safe-area-inset-top) + 14px);left:50%;transform:translate(-50%,-150%);background:var(--text);color:var(--bg);padding:10px 18px;border-radius:999px;z-index:200;transition:.3s;font-weight:500}
.toast.in{transform:translate(-50%,0)}
.del{color:var(--red);font-size:20px;padding:6px 10px}
.goal .amtline{font-size:20px}
.lrow{display:block;width:100%;text-align:start;padding:14px 0;border-bottom:1px solid var(--line)}
.lrow:last-child{border-bottom:0}
.lh{display:flex;align-items:center;gap:8px}
.ln{flex:1;font-weight:600;font-size:17px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lv{white-space:nowrap;font-size:15px}
.lb{height:12px;margin:10px 0 6px;display:flex}
.ls{font-size:12px;color:var(--muted)}
.monthbar .lbl{font:inherit;font-weight:600}
@media (max-width:380px){.hero .big{font-size:32px}h1{font-size:28px}.day{min-height:58px}}
</style>
</head>

/* Budget periods. Each salary start (S.salaryStarts, sorted ISO dates) begins a period that lasts until the end of the
   following month, or until the day before the next salary start. Days not covered fall back to monthly periods
   beginning on settings.startDay. */
const addDays=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x};
const endOfNextMonth=d=>new Date(d.getFullYear(),d.getMonth()+2,0);
const dayIn=(y,m)=>{const f=new Date(y,m,1);return new Date(f.getFullYear(),f.getMonth(),Math.min(S.settings.startDay,dim(f.getFullYear(),f.getMonth())))};
function periodFor(d){
 const ds=iso(d);let a=null,n=null;
 for(const x of S.salaryStarts){if(x<=ds)a=x;else{n=x;break}}
 const cap=n?addDays(parse(n),-1):null;
 if(a){const aE=endOfNextMonth(parse(a));if(d<=aE)return {start:parse(a),end:cap&&cap<aE?cap:aE}}
 let s=dayIn(d.getFullYear(),d.getMonth());if(s>d)s=dayIn(d.getFullYear(),d.getMonth()-1);
 let e=addDays(dayIn(s.getFullYear(),s.getMonth()+1),-1);
 if(a){const after=addDays(endOfNextMonth(parse(a)),1);if(after>s)s=after}
 if(cap&&cap<e)e=cap;
 return {start:s,end:e};
}
const curPeriod=()=>periodFor(parse(todayISO()));
const isDefaultPeriods=()=>S.settings.startDay===1&&!S.salaryStarts.length;
function txInRange(start,end){
 const res=[],today=todayISO(),s=iso(start),e=iso(end);
 for(const x of S.tx){
  if(x.wallet!==S.active)continue;
  if(!x.rec||x.rec==='none'){if(x.date>=s&&x.date<=e)res.push(x);continue}
  if(x.date>e)continue;const d=parse(x.date);
  const add=ds=>{if(ds>=s&&ds<=e&&ds>=x.date&&(ds===x.date||ds<=today))res.push({...x,date:ds})};
  if(x.rec==='monthly'){for(const c=new Date(start.getFullYear(),start.getMonth(),1);c<=end;c.setMonth(c.getMonth()+1))add(iso(new Date(c.getFullYear(),c.getMonth(),Math.min(d.getDate(),dim(c.getFullYear(),c.getMonth())))))}
  else if(x.rec==='weekly'){const c=new Date(d);while(c<start)c.setDate(c.getDate()+7);while(c<=end){add(iso(c));c.setDate(c.getDate()+7)}}
 }
 return res.sort((a,b)=>b.date.localeCompare(a.date));
}
const txInMonth=(y,m)=>txInRange(new Date(y,m,1),new Date(y,m+1,0));
const txInPeriod=p=>txInRange(p.start,p.end);
const sums=l=>l.reduce((s,x)=>(s[x.type==='income'?'inc':'exp']+=x.amount,s),{inc:0,exp:0});
function daysLeft(){const r=pv,td=parse(todayISO());if(td>=r.start&&td<=r.end)return Math.round((r.end-td)/864e5);if(r.start>td)return Math.round((r.end-r.start)/864e5)+1;return null}
function periodLabel(p){if(isDefaultPeriods())return monthName(p.start.getFullYear(),p.start.getMonth());const f=new Intl.DateTimeFormat(loc(),{day:'numeric',month:'short'});return `${f.format(p.start)} – ${f.format(p.end)}`}
const periodShort=p=>isDefaultPeriods()?shortMonth(p.start.getFullYear(),p.start.getMonth()):new Intl.DateTimeFormat(loc(),{day:'numeric',month:'short'}).format(p.start);

function sheet({title,body,done,open,hideDone}){
 const T=t(),ov=document.createElement('div');ov.className='ov';
 ov.innerHTML=`<div class="sh" role="dialog" aria-label="${esc(title)}"><div class="grab"></div><div class="shh"><button class="pillbtn" data-x="cancel">${T.cancel}</button><h3>${esc(title)}</h3><button class="pillbtn" data-x="done" style="${hideDone?'visibility:hidden':''}">${T.done}</button></div><div class="shb">${body}</div></div>`;
 document.body.appendChild(ov);requestAnimationFrame(()=>requestAnimationFrame(()=>ov.classList.add('in')));
 const close=()=>{ov.classList.remove('in');setTimeout(()=>ov.remove(),280)};
 const finish=()=>{if(!done||done(ov)!==false){close();commit()}};
 ov.addEventListener('click',e=>{if(e.target===ov)return close();const x=e.target.closest('[data-x]');if(!x)return;if(x.dataset.x==='cancel')close();if(x.dataset.x==='done')finish()});
 open&&open(ov,close,finish);
 return {ov,close,finish};
}
const amtField=(id,v)=>`<div class="ain"><span>${sym()}</span><input id="${id}" inputmode="decimal" placeholder="0" value="${v?v:''}"></div>`;

function txSheet(base,presetDate,presetType){
 const T=t(),x=base?{...base}:{type:presetType||'expense',amount:0,cat:null,date:presetDate||todayISO(),note:'',rec:'none'};

 if(!x.cat)x.cat=firstCat();

 <div class="amtin"><input id="amt" inputmode="decimal" placeholder="0" value="${x.amount||''}"><span>${sym()}</span></div>

 <div class="form"><div class="frow"><span class="ic">📅</span><label for="dt">${T.date}</label><input type="date" id="dt" value="${x.date}"></div>
 <div class="frow"><span class="ic">📝</span><label for="nt">${T.note}</label><input type="text" id="nt" placeholder="${T.optional}" value="${esc(x.note)}"></div>
 <div class="frow"><span class="ic">🔁</span><label for="rc">${T.repeat}</label><select id="rc">${['none','monthly','weekly'].map(r=>`<option value="${r}" ${x.rec===r?'selected':''}>${T[r]}</option>`).join('')}</select></div></div>
 ${base&&base.rec&&base.rec!=='none'?`<div class="muted" style="font-size:13px;text-align:center">${T.recNote}</div>`:''}
 <button class="bigbtn" id="sv">${T.save}</button><div class="err" id="er"></div>${base?`<button class="bigbtn ghost" id="dl">${T.del}</button>`:''}`;
 sheet({title:base?T.editTx:T.addTx,body,
  open(ov,close,finish){

   const paint=()=>{ov.querySelectorAll('#ty button').forEach(b=>b.classList.toggle('on',b.dataset.v===x.type));amt.style.color=x.type==='income'?'var(--green)':'var(--red)';
    $('#chips').innerHTML=S.categories.filter(c=>c.type===x.type).map(c=>`<button class="chip ${c.id===x.cat?'on':''}" data-c="${c.id}"><span class="tile">${c.emoji}</span>${esc(catName(c))}</button>`).join('')+`<button class="chip add" data-c="+"><span class="tile">+</span>${T.newCat}</button>`};
   paint();if(!base)setTimeout(()=>amt.focus(),300);
   $('#ty').onclick=e=>{const b=e.target.closest('button');if(!b||b.dataset.v===x.type)return;x.type=b.dataset.v;x.cat=firstCat();paint()};
   $('#chips').onclick=e=>{const b=e.target.closest('[data-c]');if(!b)return;if(b.dataset.c==='+')return catSheet(x.type,c=>{x.cat=c.id;paint()});x.cat=b.dataset.c;paint()};
   amt.oninput=()=>{$('#er').textContent=''};
   $('#sv').onclick=finish;
   if(base)$('#dl').onclick=()=>{if(confirm(T.delQ)){S.tx=S.tx.filter(y=>y.id!==base.id);close();commit()}};
  },
  done(ov){
   const $=s=>ov.querySelector(s),a=num($('#amt').value);
   if(!(a>0)){$('#er').textContent=T.amountErr;return false}
   if(!x.cat){$('#er').textContent=T.catErr;return false}
   const rec={id:base?base.id:uid(),wallet:base?base.wallet:S.active,type:x.type,amount:Math.round(a*1000)/1000,cat:x.cat,date:$('#dt').value||todayISO(),note:$('#nt').value.trim(),rec:$('#rc').value};
   if(base)S.tx=S.tx.map(y=>y.id===base.id?rec:y);else S.tx.push(rec);
   const d=parse(rec.date);view={y:d.getFullYear(),m:d.getMonth()};pv=periodFor(d);selDay=rec.date;
  }});
}

function periodSheet(){
 const T=t(),r=pv,rs0=iso(r.start),isSalary=S.salaryStarts.includes(rs0);
 const addStart=ds=>{S.salaryStarts=[...new Set([...S.salaryStarts,ds])].sort()};
 sheet({title:T.periodStart,body:`<div class="card" style="text-align:center"><div class="muted">${T.currentPeriod}</div><b style="font-size:20px">${longDate(iso(r.start))}</b><div class="muted">↓</div><b style="font-size:20px">${longDate(iso(r.end))}</b></div>
  <button class="bigbtn" id="st" style="margin:0 0 12px">💰 ${T.salaryToday}</button>
  <div class="form"><div class="frow"><span class="ic">📅</span><label for="ps">${T.thisPeriodStart}</label><input type="date" id="ps" value="${rs0}"></div>
  <div class="frow"><span class="ic">🔁</span><label for="sd">${T.defaultDay}</label><input type="number" id="sd" min="1" max="31" inputmode="numeric" value="${S.settings.startDay}" style="width:80px"></div></div>
  <p class="muted" style="font-size:13px;margin:8px 4px">${T.periodHelp}</p>
  ${isSalary?`<button class="bigbtn ghost" id="rs">${T.resetPeriod}</button>`:''}`,
  open(ov,close){
   // Salary day: new period from today to the end of next month (or until the next salary); budgets restart from zero
   ov.querySelector('#st').onclick=()=>{const td=todayISO(),d=parse(td);
    if(!confirm(T.salaryQ(longDate(td),longDate(iso(endOfNextMonth(d))))))return;
    const wk=iso(addDays(d,-7)); // a press within a week replaces the previous one instead of leaving a tiny period
    S.settings.startDay=d.getDate();S.salaryStarts=S.salaryStarts.filter(x=>x<wk);addStart(td);
    pv=periodFor(d);close();commit();toast(T.savedT)};
   const rs=ov.querySelector('#rs');if(rs)rs.onclick=()=>{S.salaryStarts=S.salaryStarts.filter(x=>x!==rs0);pv=curPeriod();close();commit()}},
  done(ov){
   S.settings.startDay=Math.min(31,Math.max(1,Math.round(num(ov.querySelector('#sd').value))||1));
   const ps=ov.querySelector('#ps').value;
   if(ps&&ps!==rs0){S.salaryStarts=S.salaryStarts.filter(x=>x!==rs0);addStart(ps)}
   pv=periodFor(parse(ps||rs0));
  }});
}

 sheet({title:T.wallets,hideDone:true,body:`<div class="card list" style="padding:0" id="wl"></div><div class="form"><div class="frow"><span class="ic">👛</span><input type="text" class="wide" id="wn" placeholder="${T.newWallet}" style="text-align:start"><button class="pillbtn" id="wa" style="color:var(--p2)">${T.add}</button></div></div>`,
  open(ov,close){const paint=()=>{ov.querySelector('#wl').innerHTML=S.wallets.map(w=>`<div class="opt"><button data-w="${w.id}" style="display:flex;gap:12px;flex:1;text-align:start;font-size:17px">${esc(w.emoji)} ${esc(w.name)}</button>${w.id===S.active?'<span class="ck">✓</span>':''}${S.wallets.length>1?`<button class="del" data-d="${w.id}">✕</button>`:''}</div>`).join('')};paint();
   ov.querySelector('#wl').onclick=e=>{const s=e.target.closest('[data-w]'),d=e.target.closest('[data-d]');
    if(s){S.active=s.dataset.w;close();commit()}
    if(d&&confirm(T.delWalletQ)){const id=d.dataset.d;S.wallets=S.wallets.filter(w=>w.id!==id);S.tx=S.tx.filter(x=>x.wallet!==id);S.goals=S.goals.filter(g=>g.wallet!==id);delete S.budgets[id];if(S.active===id)S.active=S.wallets[0].id;commit();paint()}};
   ov.querySelector('#wa').onclick=()=>{const n=ov.querySelector('#wn').value.trim();if(!n)return;const w={id:uid(),name:n,emoji:'👛'};S.wallets.push(w);S.active=w.id;close();commit()}}});
}

function goalSheet(g){const T=t();let emoji=g?g.emoji:'🎯';
 sheet({title:g?g.name:T.addGoal,body:`<div class="form"><div class="frow"><span class="ic" id="pv">${esc(emoji)}</span><label for="gn">${T.goalName}</label><input type="text" id="gn" value="${g?esc(g.name):''}" placeholder="${T.goalName}"></div></div>
  <div class="bcard"><div class="head">🎯 ${T.target}</div>${amtField('gt',g?g.target:'')}</div>
  ${g?`<div class="bcard"><div class="head">💰 ${T.saved}: ${money(g.saved)}</div>${amtField('ga','')}<div style="display:flex;gap:10px"><button class="bigbtn" id="dep">${T.deposit}</button><button class="bigbtn" id="wd" style="background:var(--card);color:var(--text)">${T.withdraw}</button></div></div>`:''}
  ${emojiGrid(emoji)}<div class="err" id="er"></div>${g?`<button class="bigbtn ghost" id="dl">${T.del}</button>`:''}`,
  open(ov,close){bindEmoji(ov,e=>{emoji=e;ov.querySelector('#pv').textContent=e});
   if(g){const mv=s=>{const a=num(ov.querySelector('#ga').value);if(a>0){g.saved=Math.max(0,g.saved+s*a);close();commit();toast(T.savedT)}};
    ov.querySelector('#dep').onclick=()=>mv(1);ov.querySelector('#wd').onclick=()=>mv(-1);
    ov.querySelector('#dl').onclick=()=>{if(confirm(T.delQ)){S.goals=S.goals.filter(x=>x.id!==g.id);close();commit()}}}},
  done(ov){const n=ov.querySelector('#gn').value.trim(),tg=num(ov.querySelector('#gt').value);
   if(!n||!(tg>0)){ov.querySelector('#er').textContent=!n?T.goalName+'?':T.amountErr;return false}
   if(g)Object.assign(g,{name:n,target:tg,emoji});else S.goals.push({id:uid(),wallet:S.active,name:n,emoji,target:tg,saved:0})}});
}

function pickSheet(title,opts,cur,cb){
 sheet({title,hideDone:true,body:`<div class="card list" style="padding:0">${opts.map(([v,l])=>`<button class="opt" data-v="${v}">${l}${v===cur?'<span class="ck">✓</span>':''}</button>`).join('')}</div>`,
  open(ov,close){ov.querySelector('.list').onclick=e=>{const b=e.target.closest('[data-v]');if(b){cb(b.dataset.v);close();commit()}}}});
}

async function exportData(){
 const name=`mizan-backup-${todayISO()}.json`,blob=new Blob([JSON.stringify(S,null,1)],{type:'application/json'});
 try{const f=new File([blob],name,{type:'application/json'});if(navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f],title:name});return}}catch(e){if(e.name==='AbortError')return}
 const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),2000);
}
document.getElementById('importFile').onchange=async e=>{const f=e.target.files[0];e.target.value='';if(!f)return;
 try{const d=JSON.parse(await f.text());if(!d.settings||!Array.isArray(d.tx)||!Array.isArray(d.wallets))throw 0;S=migrate(d);pv=curPeriod();commit();toast(t().imported)}catch(_){toast(t().badFile)}};

/* ---------- events ---------- */
document.getElementById('tabs').onclick=e=>{const b=e.target.closest('[data-tab]');if(b){tab=b.dataset.tab;trendSel=null;render();scrollTo(0,0)}};
document.getElementById('fab').onclick=()=>tab==='savings'?goalSheet():txSheet();
document.getElementById('app').onclick=e=>{
 const el=e.target.closest('[data-a]');if(!el)return;const a=el.dataset.a,id=el.dataset.id,s=S.settings,T=t();
 const shift=d=>{if(tab==='calendar'){const x=new Date(view.y,view.m+d,1);view={y:x.getFullYear(),m:x.getMonth()}}else pv=periodFor(addDays(d<0?pv.start:pv.end,d));trendSel=null;render()};
 switch(a){
  case 'prevM':return shift(-1);case 'nextM':return shift(1);
  case 'today':{const n=new Date();view={y:n.getFullYear(),m:n.getMonth()};selDay=todayISO();return render()}
  case 'day':selDay=id;return render();
  case 'addOnDay':return txSheet(null,selDay);
  case 'editTx':return txSheet(S.tx.find(x=>x.id===id));
  case 'catTx':return catTxSheet(id);
  case 'monthBudget':return monthBudgetSheet();
  case 'period':return periodSheet();
  case 'catBudgets':return catBudgetsSheet();
  case 'cats':return catsSheet();
  case 'wallet':return walletSheet();
  case 'addGoal':return goalSheet();
  case 'goal':return goalSheet(S.goals.find(g=>g.id===id));
  case 'trend':trendSel=trendSel===+id?null:+id;return render();
  case 'theme':return pickSheet(T.theme,Object.keys(THEMES).map(k=>[k,`<span class="dotc" style="background:${THEMES[k][1]};width:22px;height:22px"></span>${T.themes[k]}`]),s.theme,v=>s.theme=v);
  case 'currency':return pickSheet(T.currency,Object.entries(CUR).map(([k,c])=>[k,`${c[2]} ${k} <span class="muted">${c[0]}</span>`]),s.currency,v=>s.currency=v);
  case 'lang':return pickSheet(T.language,[['ar','🇸🇦 العربية'],['en','🇬🇧 English']],s.lang,v=>s.lang=v);
  case 'dark':s.dark=!s.dark;return commit();
  case 'digits':s.digits=s.digits==='latn'?'arab':'latn';return commit();
  case 'dec':s.decimals=+id;return commit();
  case 'tab-stats':tab='stats';return render();
  case 'export':return exportData();
  case 'import':return document.getElementById('importFile').click();
  case 'reset':if(confirm(T.resetQ)){S=migrate(defaults());pv=curPeriod();commit()}return;
 }
};
pv=curPeriod();
render();
if('serviceWorker' in navigator&&location.protocol!=='file:')navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
</body>
</html>
